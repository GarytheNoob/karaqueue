<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="popup.css" />
<title>KaraQueue</title>
</head>
<body>
  <!-- Same 48px bar as the pages: mark, name, one rule. -->
  <header class="bar">
    <svg class="mark" viewBox="0 0 20 20" fill="none" stroke="currentColor"
         stroke-width="1.6" stroke-linecap="round" aria-hidden="true" focusable="false">
      <rect x="7.1" y="2.2" width="5.8" height="9.6" rx="2.9" />
      <path d="M4.4 9.2a5.6 5.6 0 0 0 11.2 0" />
      <path d="M10 14.8v3.1M7.4 17.9h5.2" />
    </svg>
    <h1>KaraQueue</h1>
  </header>

  <main class="pop">
    <!-- Connection is a setting, not the popup's main job: quiet control. -->
    <section aria-labelledby="serverLbl">
      <label class="lbl" id="serverLbl" for="serverUrl">队列服务</label>
      <div class="field-row">
        <input id="serverUrl" type="url" inputmode="url" spellcheck="false"
               autocomplete="url" placeholder="http://192.168.1.5:7777" />
        <button id="save" class="btn btn--quiet save" type="button">保存</button>
      </div>
      <p class="hint">需与电脑在同一局域网，地址要带 :7777 端口</p>
    </section>

    <!-- The one primary action: start / return to the live track. -->
    <div class="actions">
      <button id="open" class="btn btn--block" type="button">打开 / 播放当前曲目</button>
      <button id="skip" class="btn btn--quiet btn--block" type="button">跳过当前，直接播下一首</button>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section class="sec" aria-labelledby="nowLbl">
      <div class="sec-head">
        <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <h2 id="nowLbl">正在播放</h2>
      </div>
      <div id="now" class="panel"></div>
    </section>

    <section class="sec next-sec" id="nextSec" aria-labelledby="nextLbl" hidden>
      <div class="sec-head">
        <h2 id="nextLbl">下一首</h2>
      </div>
      <div id="next"></div>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
