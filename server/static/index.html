<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nikokara 点歌</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
    background: #101014; color: #e8e8ee; min-height: 100vh;
  }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 20px; margin: 8px 0 16px; }
  h2 { font-size: 14px; margin: 24px 0 8px; color: #9aa; letter-spacing: .05em; }
  form { display: flex; flex-direction: column; gap: 8px; }
  input {
    background: #1c1c22; border: 1px solid #33333d; border-radius: 10px;
    padding: 12px 14px; color: inherit; font-size: 16px; width: 100%;
  }
  input:focus { outline: none; border-color: #58a6ff; }
  button {
    background: #2f6fed; color: #fff; border: 0; border-radius: 10px;
    padding: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; }
  button.skip {
    background: transparent; border: 1px solid #555; color: #bbb;
    font-size: 12px; padding: 4px 10px; font-weight: 400;
  }
  .msg { min-height: 20px; font-size: 13px; color: #f66; margin: 2px 0; }
  .msg.ok { color: #5d5; }
  .card {
    background: #17171d; border: 1px solid #26262e; border-radius: 12px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .card .title { font-size: 14px; line-height: 1.4; }
  .card .meta { font-size: 12px; color: #888; margin-top: 4px; display: flex; justify-content: space-between; }
  .card.now { border-color: #2f6fed; }
  .tag {
    font-size: 11px; background: #2f6fed; color: #fff; border-radius: 4px;
    padding: 1px 6px; margin-right: 6px; vertical-align: 2px;
  }
  .tag.done { background: #444; color: #aaa; }
  .empty { color: #666; font-size: 13px; padding: 6px 2px; }
  header { display: flex; justify-content: space-between; align-items: baseline; }
  header small { color: #666; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Nikokara 点歌</h1>
    <small id="queueCount"></small>
  </header>

  <form id="f">
    <input id="by" placeholder="你的昵称" autocomplete="nickname" />
    <input id="input" placeholder="BV号 / b23.tv / bilibili 链接" required />
    <button id="btn" type="submit">加入队列</button>
    <div class="msg" id="msg"></div>
  </form>

  <h2>正在播放</h2>
  <div id="now"></div>

  <h2>队列</h2>
  <div id="queue"></div>

  <h2>刚播过</h2>
  <div id="history"></div>
</main>

<script>
"use strict";
/* Client logic: submit + live state via SSE. Kept vanilla so the whole
   server stays dependency-free. */
const $ = (id) => document.getElementById(id);
const byInput = $("by");
const msg = $("msg");

// Persist the nickname between sessions.
byInput.value = localStorage.getItem("nikokara:by") || "";
byInput.addEventListener("change", () => localStorage.setItem("nikokara:by", byInput.value.trim()));

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function fmtDur(s) {
  if (!s) return "";
  const m = Math.floor(s / 60), r = s % 60;
  return `${m}:${String(r).padStart(2, "0")}`;
}

function label(item) {
  const part = item.page_count > 1 ? ` · P${item.page}` : "";
  return `${esc(item.title)}${part ? ` <span style="color:#7ab">${part}</span>` : ""}`;
}

function card(item, isNow) {
  const part = item.page_count > 1 ? ` · P${item.page}` : "";
  const skip = isNow ? ` <button class="skip" data-skip="1">跳过</button>` : "";
  const tag = isNow ? `<span class="tag">NOW</span>` : item.status === "played" || item.status === "skipped" ? `<span class="tag done">${item.status === "skipped" ? "跳过" : "已播"}</span>` : "";
  return `<div class="card ${isNow ? "now" : ""}">
    <div class="title">${tag}${label(item)}${skip}</div>
    <div class="meta"><span>by ${esc(item.requested_by)}</span><span>${esc(item.uploader)}${item.duration_s ? " · " + fmtDur(item.duration_s) : ""}</span></div>
  </div>`;
}

function render(state) {
  $("queueCount").textContent = `剩 ${state.queue.length} 首`;
  $("now").innerHTML = state.current ? card(state.current, true) : `<div class="empty">（空闲中，等待点歌）</div>`;
  $("queue").innerHTML = state.queue.length
    ? state.queue.map((i) => card(i)).join("")
    : `<div class="empty">队列空空，快点歌！</div>`;
  $("history").innerHTML = state.history.length
    ? state.history.slice(0, 5).map((i) => card(i)).join("")
    : `<div class="empty">还没有播过。</div>`;
}

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = $("input").value.trim();
  if (!input) return;
  $("btn").disabled = true;
  msg.className = "msg";
  try {
    const res = await fetch("/api/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ input, by: byInput.value.trim() || "anonymous" }),
    });
    const body = await res.json();
    if (body.ok) {
      msg.textContent = "已加入队列 ✓ " + body.item.title;
      msg.classList.add("ok");
      $("input").value = "";
      $("input").focus();
    } else {
      msg.textContent = body.message || "提交失败";
    }
  } catch (err) {
    msg.textContent = "网络错误: " + err;
  } finally {
    $("btn").disabled = false;
  }
});

// Skip button (delegated; only rendered on the NOW card).
document.addEventListener("click", (e) => {
  if (!e.target.dataset.skip) return;
  fetch("/api/skip", { method: "POST" }).catch(console.error);
});

async function refresh() {
  const res = await fetch("/api/state");
  render(await res.json());
}

// Initial fetch + live updates.
refresh();
const es = new EventSource("/api/events");
es.addEventListener("state", (e) => render(JSON.parse(e.data)));
</script>
</body>
</html>
