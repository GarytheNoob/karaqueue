<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KaraQueue 点歌</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
    background: #101014; color: #e8e8ee; min-height: 100vh;
  }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 20px; margin: 8px 0 16px; }
  h2 { font-size: 14px; margin: 24px 0 8px; color: #9aa; letter-spacing: .05em; }
  form { display: flex; flex-direction: column; gap: 8px; }
  .history-link {
    display: block; text-align: center; text-decoration: none;
    background: #17171d; border: 1px dashed #33333d; border-radius: 10px;
    padding: 10px; color: #7ab; font-size: 13px;
  }
  .view { display: none; }
  .view.active { display: block; }
  .back { color: #7ab; text-decoration: none; font-size: 14px; flex: none; }
  input {
    background: #1c1c22; border: 1px solid #33333d; border-radius: 10px;
    padding: 12px 14px; color: inherit; font-size: 16px; width: 100%;
  }
  input:focus { outline: none; border-color: #58a6ff; }
  button {
    background: #2f6fed; color: #fff; border: 0; border-radius: 10px;
    padding: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input:disabled { opacity: .5; }
  .msg { min-height: 20px; font-size: 13px; color: #f66; margin: 2px 0; }
  .msg.ok { color: #5d5; }
  .card {
    background: #17171d; border: 1px solid #26262e; border-radius: 12px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .card .title { font-size: 14px; line-height: 1.5; display: flex; align-items: center; }
  .card .meta { font-size: 12px; color: #888; margin-top: 4px; display: flex; justify-content: space-between; }
  .card.now { border-color: #2f6fed; }
  .card.next { border-color: #e0a33f; }
  .tag {
    font-size: 11px; background: #2f6fed; color: #fff; border-radius: 4px;
    padding: 1px 6px; margin-right: 6px; vertical-align: 2px;
  }
  .tag.done { background: #444; color: #aaa; }
  .tag.next { background: #e0a33f; color: #2b1d00; }
  .tag.mine { background: #2fa25c; color: #fff; }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  .mini {
    font-size: 12px; font-weight: 600; padding: 5px 10px;
    border-radius: 8px; background: #26262e; color: #eee;
  }
  .mini:active { background: #33333d; }
  .idx {
    color: #67718a; font-size: 12px; font-weight: 600;
    margin-right: 7px; font-variant-numeric: tabular-nums;
  }
  .empty { color: #666; font-size: 13px; padding: 6px 2px; }
  header { display: flex; justify-content: space-between; align-items: baseline; }
  header small { color: #666; }
  .row-head { display: flex; justify-content: space-between; align-items: baseline; }
  .row-head small { color: #666; }
  .hdr-right { display: inline-flex; gap: 10px; align-items: center; color: #666; }
  .side-btn {
    background: #17171d; border: 1px solid #33333d; color: #ccc;
    border-radius: 8px; padding: 4px 10px; font-size: 14px; cursor: pointer;
  }
  .side-btn:active { background: #26262e; }
  #sideOverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40;
  }
  #sideOverlay[hidden] { display: none; }
  #sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 41;
    width: min(340px, 86vw); padding: 16px; overflow-y: auto;
    background: #17171d; border-right: 1px solid #33333d;
    transform: translateX(-102%); transition: transform .22s ease;
  }
  #sidebar.open { transform: translateX(0); }
  .side-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 15px; font-weight: 600; margin-bottom: 6px;
  }
  .side-x {
    background: #26262e; color: #eee; border: 0; border-radius: 8px;
    padding: 4px 12px; font-size: 14px; cursor: pointer; font-weight: 400;
  }
  #sidebar dt { color: #888; font-size: 12px; margin-top: 12px; }
  #sidebar dd { margin: 2px 0 0; font-size: 14px; word-break: break-all; }
  #qrBox {
    display: flex; justify-content: center; margin-top: 16px;
    background: #fff; border-radius: 10px; padding: 10px;
  }
  #qrBox svg { display: block; width: 100%; max-width: 216px; height: auto; }
  .side-hint { color: #888; font-size: 12px; margin: 10px 0 0; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <header>
    <h1 data-i18n="index.title">KaraQueue 点歌</h1>
    <small class="hdr-right">
      <span id="langSwitch"></span>
      <button id="sideBtn" class="side-btn" aria-label="局域网接入" type="button">☰</button>
    </small>
  </header>

  <section id="view-main" class="view">
    <form id="f">
      <input id="by" autocomplete="nickname" data-i18n-placeholder="index.by_placeholder" />
      <input id="input" required data-i18n-placeholder="index.input_placeholder" />
      <button id="btn" type="submit" data-i18n="index.submit">加入队列</button>
      <div class="msg" id="msg"></div>
    </form>

    <a class="history-link" href="#/history"><span data-i18n="index.history_link">已播历史</span> <span id="historyCount"></span> ›</a>

    <h2 data-i18n="head.now_playing">正在播放</h2>
    <div id="now"></div>

    <h2 class="row-head"><span data-i18n="head.queue">队列</span><small id="queueCount"></small></h2>
    <div id="queue"></div>
  </section>

  <section id="view-history" class="view">
    <header>
      <h1 data-i18n="head.history">已播历史</h1>
      <a class="back" href="#/" data-i18n="index.back">‹ 返回点歌</a>
    </header>
    <div id="history"></div>
  </section>
</main>

<!-- LAN access sidebar: how guests reach this page with a phone. -->
<div id="sideOverlay" hidden></div>
<aside id="sidebar" aria-hidden="true">
  <div class="side-head">
    <span data-i18n="side.title">局域网接入</span>
    <button id="sideClose" class="side-x" type="button" aria-label="关闭">×</button>
  </div>
  <dl>
    <dt data-i18n="side.wifi">Wi-Fi 名称</dt>
    <dd id="ssidVal">—</dd>
    <dt data-i18n="side.ip">服务地址</dt>
    <dd id="ipVal">—</dd>
  </dl>
  <div id="qrBox"></div>
  <p class="side-hint" data-i18n="side.qr_hint">同一 Wi-Fi 下扫码直达点歌页</p>
</aside>

<script src="i18n/i18n.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="ui/ui.js"></script>
<script>
"use strict";
/* Client logic: submit + live state via SSE. Kept vanilla so the whole
   server stays dependency-free. */
window.I18N_TITLE_KEY = "index.title";
const $ = (id) => document.getElementById(id);
const byInput = $("by");
const msg = $("msg");

// Persist the nickname between sessions.
byInput.value = localStorage.getItem("karaqueue:by") || "";
byInput.addEventListener("change", () => localStorage.setItem("karaqueue:by", byInput.value.trim()));

/* Guest identity for fair mode: an opaque uid in a long-lived cookie, so
   the per-guest lock survives nickname edits and page reloads. */
const UID = (() => {
  const m = document.cookie.match(/(?:^|;\s*)kq_uid=([^;]+)/);
  if (m) return m[1];
  const v = crypto.randomUUID
    ? crypto.randomUUID()
    : `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
  document.cookie = `kq_uid=${v}; max-age=15552000; path=/; SameSite=Lax`; // 180 days
  return v;
})();

function card(item, { now = false, next = false, index = 0, withdraw = false } = {}) {
  const part = item.page_count > 1 ? ` · P${item.page}` : "";
  // "Mine" badge (green) marks every track this browser requested,
  // everywhere: now playing, queue and history.
  const mine = !!item.requester_uid && item.requester_uid === UID;
  const mineTag = mine ? `<span class="tag mine">${t("tag.mine")}</span>` : "";
  const tag = now
    ? `<span class="tag">NOW</span>${mineTag}`
    : next
      ? `<span class="tag next">NEXT</span>${mineTag}`
      : `${mineTag}${item.status === "played" || item.status === "skipped"
          ? `<span class="tag done">${t(item.status === "skipped" ? "tag.skipped" : "tag.played")}</span>`
          : ""}`;
  const idx = index
    ? `<span class="idx">${index}.</span>`
    : "";
  return `<div class="card ${now ? "now" : next ? "next" : ""}">
    <div class="title">${idx}${tag}${label(item)}</div>
    <div class="meta"><span>${esc(t("card.requested_by", { by: item.requested_by }))}</span><span>${item.duration_s ? fmtDur(item.duration_s) : ""}</span></div>
    ${withdraw && mine ? `<div class="actions"><button class="mini" data-withdraw="${esc(item.id)}" title="${esc(t("index.withdraw_title"))}">${esc(t("index.withdraw"))}</button></div>` : ""}
  </div>`;
}

let lastState = null;
/* Fair rotation (admin toggle): while one of my own requests is playing or
   queued (matched by cookie uid), the submit button is greyed out and my
   nickname input is locked until that song has finished. */
function applyFairMode() {
  if (!lastState) return;
  const mine = !!lastState.config?.oneSongPerGuest &&
    (lastState.current ? [lastState.current, ...lastState.queue] : lastState.queue)
      .some((i) => i.requester_uid && i.requester_uid === UID);
  const btn = $("btn");
  btn.disabled = mine;
  btn.textContent = mine ? t("index.fair.locked") : t("index.submit");
  btn.title = mine ? t("index.fair.submit_lock") : "";
  byInput.disabled = mine;
  byInput.title = mine ? t("index.fair.nick_lock") : "";
}

function render(state) {
  lastState = state;
  $("queueCount").textContent = t("index.queue_count", { n: state.queue.length });
  $("historyCount").textContent = state.history.length ? `(${state.history.length})` : "";
  $("now").innerHTML = state.current ? card(state.current, { now: true }) : `<div class="empty">${t("empty.now")}</div>`;
  $("queue").innerHTML = state.queue.length
    ? state.queue.map((i, idx) => card(i, { next: idx === 0, withdraw: true })).join("")
    : `<div class="empty">${t("empty.queue")}</div>`;
  // History is stored newest-first on the server; display oldest-first so
  // index 1 is the first song ever played, newest at the bottom.
  $("history").innerHTML = state.history.length
    ? [...state.history].reverse().map((item, idx) => card(item, { index: idx + 1 })).join("")
    : `<div class="empty">${t("empty.history")}</div>`;
  applyFairMode();
  enhanceMarquee();
}

/* Hash-based secondary view: #/history shows the played list, anything
   else shows the main request view. */
function applyView() {
  const history = location.hash === "#/history";
  $("view-main").classList.toggle("active", !history);
  $("view-history").classList.toggle("active", history);
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", applyView);
applyView();

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = $("input").value.trim();
  if (!input) return;
  $("btn").disabled = true;
  msg.className = "msg";
  try {
    const res = await fetch("/api/submit", {
      method: "POST",
      // The lang header lets the server answer in the switched language.
      headers: { "Content-Type": "application/json", "X-Karaqueue-Lang": i18nLang },
      body: JSON.stringify({ input, by: byInput.value.trim() || "anonymous", uid: UID }),
    });
    const text = await res.text();
    let body;
    try {
      body = JSON.parse(text);
    } catch {
      // The server answered with an HTML page instead of JSON. This build
      // always answers JSON, so that usually means something else owns
      // this address/port (e.g. another dev server or network preview).
      throw new Error(t("msg.not_json"));
    }
    if (body.ok) {
      // Render the fresh state right away so the fair-mode lock applies
      // before the next SSE frame lands.
      if (body.state) render(body.state);
      msg.textContent = body.warning
        ? t("msg.submitted_warning", { warning: body.warning })
        : t("msg.submitted", { title: titleText(body.item) });
      if (body.warning) msg.style.color = "#e0a33f";
      else msg.style.removeProperty("color");
      msg.classList.add(body.warning ? "" : "ok");
      $("input").value = "";
      $("input").focus();
    } else {
      msg.textContent = body.message || t("msg.submit_failed");
    }
  } catch (err) {
    msg.textContent = t("msg.submit_error", { e: err.message || err });
  } finally {
    // Re-enable for the next submit; fair-mode lockout (if any) is
    // re-applied immediately from the latest known state.
    $("btn").disabled = false;
    applyFairMode();
  }
});

// Skip control intentionally lives only in the extension popup, not here.

/* Withdraw my own queued track. Available regardless of fair mode;
   the server enforces that only the requesting browser may withdraw. */
document.addEventListener("click", async (e) => {
  const id = e.target?.dataset?.withdraw;
  if (!id) return;
  msg.className = "msg";
  try {
    const res = await fetch("/api/withdraw", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Karaqueue-Lang": i18nLang },
      body: JSON.stringify({ id, uid: UID }),
    });
    const body = await res.json().catch(() => null);
    if (res.ok && body?.ok) {
      if (body.state) render(body.state);
      msg.textContent = t("msg.withdrawn", { title: body.item.part || titleText(body.item) });
      msg.classList.add("ok");
    } else {
      msg.textContent = (body && body.message) || t("msg.withdraw_failed");
    }
  } catch (err) {
    msg.textContent = t("msg.withdraw_error", { e: err.message || err });
  }
});

async function refresh() {
  const res = await fetch("/api/state");
  render(await res.json());
}

/* --- LAN access sidebar lives in ui/ui.js (shared with admin). ------- */

/* Language switching re-renders the dynamic parts (cards, counts,
 * fair-mode lock, sidebar labels) in the new language. */
setOnLangSwitch(() => {
  if (lastState) render(lastState);
  refreshSidebarI18n();
});

/* Boot sequence: resolve the language first, then talk to the server. */
initI18n(() => {
  initSidebar();
  refreshSidebarI18n();
  refresh();
  const es = new EventSource("/api/events");
  es.addEventListener("state", (e) => render(JSON.parse(e.data)));
});

/* Mobile browsers freeze background tabs and may drop the SSE stream
   without notice (iOS Safari does not always reconnect). As a fallback,
   re-fetch the state whenever the tab becomes visible again, and keep a
   light poll running while the page is visible. */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") refresh().catch(() => {});
});
setInterval(() => {
  if (document.visibilityState === "visible") refresh().catch(() => {});
}, 5000);
</script>
</body>
</html>
