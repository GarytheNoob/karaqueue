<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#000000" />
<title>KaraQueue 点歌</title>
<link rel="stylesheet" href="/ui/theme.css" />
</head>
<body>
<main class="shell shell--split">
  <section id="view-main" class="view active">
    <!-- 56px bar: the product's mark and name, then the page's own tools.
         Same bar on both pages, one ground, one rule. -->
    <header class="bar">
      <div class="brand">
        <svg class="mark" viewBox="0 0 20 20" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" aria-hidden="true" focusable="false">
          <rect x="7.1" y="2.2" width="5.8" height="9.6" rx="2.9" />
          <path d="M4.4 9.2a5.6 5.6 0 0 0 11.2 0" />
          <path d="M10 14.8v3.1M7.4 17.9h5.2" />
        </svg>
        <h1><span class="wordmark">KaraQueue </span><span data-i18n="index.title_short">点歌</span></h1>
      </div>
      <div class="bar-tools">
        <span id="langSwitch"></span>
        <button id="sideBtn" class="icon-btn" aria-label="局域网接入" type="button">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" aria-hidden="true" focusable="false">
            <path d="M2.6 7.4a13.2 13.2 0 0 1 14.8 0" />
            <path d="M5.5 10.8a8.6 8.6 0 0 1 9 0" />
            <path d="M8.3 14.1a4.1 4.1 0 0 1 3.4 0" />
            <circle cx="10" cy="17" r="0.9" fill="currentColor" stroke="none" />
          </svg>
        </button>
      </div>
    </header>

    <div class="split">
      <!-- The slip. Requesting is why the page exists, so it opens the
           page on a phone; on a laptop it keeps its own column. -->
      <div class="split__aside">
        <form id="f" class="panel slip">
          <label class="field" for="by">
            <span class="lbl" data-i18n="index.by_label">你的昵称</span>
            <input id="by" name="by" autocomplete="nickname"
                   data-i18n-placeholder="index.by_placeholder" />
          </label>
          <label class="field" for="input">
            <span class="lbl" data-i18n="index.input_label">歌曲链接</span>
            <input id="input" name="input" required
                   data-i18n-placeholder="index.input_placeholder" />
          </label>
          <button id="btn" class="btn btn--block" type="submit" data-i18n="index.submit">加入队列</button>
        </form>
        <a class="linkrow" href="#/history">
          <span data-i18n="index.history_link">已播历史</span>
          <span class="count" id="historyCount"></span>
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M8 4.5l6 5.5-6 5.5" /></svg>
        </a>
      </div>

      <div class="split__main">
        <section class="sec">
          <div class="sec-head">
            <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
            <h2 data-i18n="head.now_playing">正在播放</h2>
          </div>
          <div id="now"></div>
        </section>

        <section class="sec">
          <div class="sec-head">
            <h2 data-i18n="head.queue">队列</h2>
            <span class="count" id="queueCount"></span>
          </div>
          <div id="queue"></div>
        </section>
      </div>
    </div>
  </section>

  <section id="view-history" class="view">
    <header class="bar">
      <a class="back" href="#/">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M12 4.5L6 10l6 5.5" /></svg>
        <span data-i18n="index.back">返回点歌</span>
      </a>
      <h1 data-i18n="head.history">已播历史</h1>
    </header>
    <div id="history" class="list-plain"></div>
  </section>
</main>

<!-- LAN access drawer: how guests reach this page with a phone. -->
<div id="sideOverlay" hidden></div>
<aside id="sidebar" aria-hidden="true">
  <div class="side-head">
    <span data-i18n="side.title">局域网接入</span>
    <button id="sideClose" class="side-x" type="button" aria-label="关闭">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M5 5l10 10M15 5L5 15" /></svg>
    </button>
  </div>
  <dl>
    <dt data-i18n="side.wifi">Wi-Fi 名称</dt>
    <dd id="ssidVal">—</dd>
    <dt data-i18n="side.ip">服务地址</dt>
    <dd id="ipVal">—</dd>
  </dl>
  <div id="qrBox"></div>
  <p class="side-hint" data-i18n="side.qr_hint">同一 Wi-Fi 下扫码直达点歌页</p>
</aside>

<script src="i18n/i18n.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="ui/ui.js"></script>
<script>
"use strict";
/* Client logic: submit + live state via SSE. Kept vanilla so the whole
   server stays dependency-free. */
window.I18N_TITLE_KEY = "index.title";
const $ = (id) => document.getElementById(id);
const byInput = $("by");

// Persist the nickname between sessions.
byInput.value = localStorage.getItem("karaqueue:by") || "";
byInput.addEventListener("change", () => localStorage.setItem("karaqueue:by", byInput.value.trim()));

/* Guest identity for fair mode: an opaque uid in a long-lived cookie, so
   the per-guest lock survives nickname edits and page reloads. */
const UID = (() => {
  const m = document.cookie.match(/(?:^|;\s*)kq_uid=([^;]+)/);
  if (m) return m[1];
  const v = crypto.randomUUID
    ? crypto.randomUUID()
    : `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
  document.cookie = `kq_uid=${v}; max-age=15552000; path=/; SameSite=Lax`; // 180 days
  return v;
})();

/* One line of the running order: rank, title, requester, duration. The
 * chips carry identity (mine) and the next slot; they never repeat the
 * section heading. History rows pass `index` and no action. */
function trackRow(item, { next = false, index = 0, withdraw = false } = {}) {
  const mine = !!item.requester_uid && item.requester_uid === UID;
  const chips = [
    next ? `<span class="chip">${esc(t("tag.next"))}</span>` : "",
    mine ? `<span class="chip chip--mine">${esc(t("tag.mine"))}</span>` : "",
    item.status === "skipped" ? `<span class="chip chip--muted">${esc(t("tag.skipped"))}</span>` : "",
  ].join("");
  const action = withdraw && mine
    ? `<button class="linkbtn" data-withdraw="${esc(item.id)}" title="${esc(t("index.withdraw_title"))}">${esc(t("index.withdraw"))}</button>`
    : "";
  return `<div class="track" data-track>
    ${index ? `<span class="pos">${index}</span>` : ""}
    <div class="tbody">
      <div class="ttl">${label(item)}${chips ? `<span class="chips">${chips}</span>` : ""}</div>
      <div class="sub">
        <span class="by">${esc(t("card.requested_by", { by: item.requested_by }))}</span>
        ${action}
        <span class="dur">${item.duration_s ? fmtDur(item.duration_s) : ""}</span>
      </div>
    </div>
  </div>`;
}

/* The live track is the page's biggest block and the only raised panel
 * under "正在播放": one title at 18px, requester and duration beneath. */
function nowPanel(item) {
  const mine = !!item.requester_uid && item.requester_uid === UID;
  return `<div class="panel now" data-track>
    <div class="now-title">${label(item)}${mine ? `<span class="chips"><span class="chip chip--mine">${esc(t("tag.mine"))}</span></span>` : ""}</div>
    <div class="now-meta">
      <span>${esc(t("card.requested_by", { by: item.requested_by }))}</span>
      <span class="dur">${item.duration_s ? fmtDur(item.duration_s) : ""}</span>
    </div>
  </div>`;
}

let lastState = null;
/* Fair rotation (admin toggle): while one of my own requests is playing or
   queued (matched by cookie uid), the submit button is greyed out and my
   nickname input is locked until that song has finished. */
function applyFairMode() {
  if (!lastState) return;
  const mine = !!lastState.config?.oneSongPerGuest &&
    (lastState.current ? [lastState.current, ...lastState.queue] : lastState.queue)
      .some((i) => i.requester_uid && i.requester_uid === UID);
  const btn = $("btn");
  btn.disabled = mine;
  btn.textContent = mine ? t("index.fair.locked") : t("index.submit");
  btn.title = mine ? t("index.fair.submit_lock") : "";
  byInput.disabled = mine;
  byInput.title = mine ? t("index.fair.nick_lock") : "";
}

function render(state) {
  lastState = state;
  $("queueCount").textContent = state.queue.length ? t("index.queue_count", { n: state.queue.length }) : "";
  $("historyCount").textContent = state.history.length ? String(state.history.length) : "";
  $("now").innerHTML = state.current ? nowPanel(state.current) : `<div class="empty empty--now">${t("empty.now")}</div>`;
  $("queue").innerHTML = state.queue.length
    ? `<div class="setlist">${state.queue.map((i, idx) => trackRow(i, { index: idx + 1, next: idx === 0, withdraw: true })).join("")}</div>`
    : `<div class="empty">${t("empty.queue")}</div>`;
  // History is stored newest-first on the server; display oldest-first so
  // index 1 is the first song ever played, newest at the bottom.
  $("history").innerHTML = state.history.length
    ? state.history.slice().reverse().map((item, idx) => trackRow(item, { index: idx + 1 })).join("")
    : `<div class="empty">${t("empty.history")}</div>`;
  applyFairMode();
  enhanceMarquee();
}

/* Hash-based secondary view: #/history shows the played list, anything
   else shows the main request view. */
function applyView() {
  const history = location.hash === "#/history";
  $("view-main").classList.toggle("active", !history);
  $("view-history").classList.toggle("active", history);
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", applyView);
applyView();

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = $("input").value.trim();
  if (!input) return;
  $("btn").disabled = true;
  try {
    const res = await fetch("/api/submit", {
      method: "POST",
      // The lang header lets the server answer in the switched language.
      headers: { "Content-Type": "application/json", "X-Karaqueue-Lang": i18nLang },
      body: JSON.stringify({ input, by: byInput.value.trim() || "anonymous", uid: UID }),
    });
    const text = await res.text();
    let body;
    try {
      body = JSON.parse(text);
    } catch {
      // The server answered with an HTML page instead of JSON. This build
      // always answers JSON, so that usually means something else owns
      // this address/port (e.g. another dev server or network preview).
      throw new Error(t("msg.not_json"));
    }
    if (body.ok) {
      // Render the fresh state right away so the fair-mode lock applies
      // before the next SSE frame lands.
      if (body.state) render(body.state);
      showToast(body.warning ? "warn" : "ok",
        body.warning
          ? t("msg.submitted_warning", { warning: body.warning })
          : t("msg.submitted", { title: titleText(body.item) }));
      $("input").value = "";
      $("input").focus();
    } else {
      showToast("fail", body.message || t("msg.submit_failed"));
    }
  } catch (err) {
    showToast("fail", t("msg.submit_error", { e: err.message || err }));
  } finally {
    // Re-enable for the next submit; fair-mode lockout (if any) is
    // re-applied immediately from the latest known state.
    $("btn").disabled = false;
    applyFairMode();
  }
});

// Skip control intentionally lives only in the extension popup, not here.

/* Withdraw my own queued track. Available regardless of fair mode;
   the server enforces that only the requesting browser may withdraw. */
document.addEventListener("click", async (e) => {
  const id = e.target?.dataset?.withdraw;
  if (!id) return;
  try {
    const res = await fetch("/api/withdraw", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Karaqueue-Lang": i18nLang },
      body: JSON.stringify({ id, uid: UID }),
    });
    const body = await res.json().catch(() => null);
    if (res.ok && body?.ok) {
      if (body.state) render(body.state);
      showToast("ok", t("msg.withdrawn", { title: body.item.part || titleText(body.item) }));
    } else {
      showToast("fail", (body && body.message) || t("msg.withdraw_failed"));
    }
  } catch (err) {
    showToast("fail", t("msg.withdraw_error", { e: err.message || err }));
  }
});

async function refresh() {
  const res = await fetch("/api/state");
  render(await res.json());
}

/* --- LAN access sidebar lives in ui/ui.js (shared with admin). ------- */

/* Language switching re-renders the dynamic parts (cards, counts,
 * fair-mode lock, sidebar labels) in the new language. */
setOnLangSwitch(() => {
  if (lastState) render(lastState);
  refreshSidebarI18n();
});

/* Boot sequence: resolve the language first, then talk to the server. */
initI18n(() => {
  initSidebar();
  refreshSidebarI18n();
  refresh();
  const es = new EventSource("/api/events");
  es.addEventListener("state", (e) => render(JSON.parse(e.data)));
});

/* Mobile browsers freeze background tabs and may drop the SSE stream
   without notice (iOS Safari does not always reconnect). As a fallback,
   re-fetch the state whenever the tab becomes visible again, and keep a
   light poll running while the page is visible. */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") refresh().catch(() => {});
});
setInterval(() => {
  if (document.visibilityState === "visible") refresh().catch(() => {});
}, 5000);
</script>
</body>
</html>
