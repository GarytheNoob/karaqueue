<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#000000" />
<title>KaraQueue 管理后台</title>
<link rel="stylesheet" href="/ui/theme.css" />
</head>
<body>
<main class="shell shell--wide">
  <!-- Same bar as the request page: the product's mark and name, then the
       page's tools. "管理后台" says what the screen is, not who you are. -->
  <header class="bar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 20 20" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" aria-hidden="true" focusable="false">
        <rect x="7.1" y="2.2" width="5.8" height="9.6" rx="2.9" />
        <path d="M4.4 9.2a5.6 5.6 0 0 0 11.2 0" />
        <path d="M10 14.8v3.1M7.4 17.9h5.2" />
      </svg>
      <h1><span class="wordmark">KaraQueue </span><span data-i18n="admin.title_short">管理后台</span></h1>
    </div>
    <div class="bar-tools">
      <span id="langSwitch"></span>
      <button id="sideBtn" class="icon-btn" aria-label="局域网接入" type="button">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" aria-hidden="true" focusable="false">
          <path d="M2.6 7.4a13.2 13.2 0 0 1 14.8 0" />
          <path d="M5.5 10.8a8.6 8.6 0 0 1 9 0" />
          <path d="M8.3 14.1a4.1 4.1 0 0 1 3.4 0" />
          <circle cx="10" cy="17" r="0.9" fill="currentColor" stroke="none" />
        </svg>
      </button>
    </div>
  </header>

  <div class="admin-grid">
    <!-- 1. What is on stage, and the host's most frequent job beside it. -->
    <section class="sec span-2">
      <div class="sec-head">
        <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <h2 data-i18n="head.now_playing">正在播放</h2>
      </div>
      <div id="now"></div>
    </section>

    <!-- 2. The running order: the screen's working list. -->
    <section class="sec">
      <div class="sec-head">
        <h2 data-i18n="head.queue">队列</h2>
        <span class="count" id="queueCount"></span>
      </div>
      <div class="hint" data-i18n="admin.queue_hint">拖动左侧把手调整顺序，或用键盘方向键；「提前」把这首歌移到队首，「移出」把它撤下队列。改动实时同步到大屏和所有点歌页。</div>
      <div id="queue"></div>
    </section>

    <!-- 3. Played history, with the one-tap re-request. -->
    <section class="sec">
      <div class="sec-head">
        <h2 data-i18n="head.history">已播历史</h2>
        <span class="count" id="historyCount"></span>
      </div>
      <div id="history"></div>
    </section>

    <!-- 4. Rules change once a night: they close the page, not open it. -->
    <section class="sec span-2">
      <div class="sec-head">
        <h2 data-i18n="admin.rules_head">点歌规则</h2>
      </div>
      <div class="panel rules">
        <div class="rule">
          <div class="rule-main">
            <label class="rule-title" for="allowQueuedDuplicates" data-i18n="admin.dup_label">允许队列中重复点同一首歌</label>
            <div class="rule-desc" data-i18n="admin.dup_desc">关闭：同一首歌重复提交会被拒绝（正在播放/已在队列中）。
开启：同一首歌可以在排队里出现多次。</div>
          </div>
          <button type="button" class="switch" id="allowQueuedDuplicates" role="switch"
                  aria-checked="false"></button>
        </div>
        <div class="rule">
          <div class="rule-main">
            <label class="rule-title" for="oneSongPerGuest" data-i18n="admin.fair_label">公平轮唱 · 每人限点一首</label>
            <div class="rule-desc" data-i18n="admin.fair_desc">开启后每人（按浏览器 Cookie 识别，不受改昵称影响）同时只能有一首在唱或在排，等自己那首唱完才能再点；被锁定期间，点歌页上该客人的「加入队列」按钮置灰、昵称输入框锁定。</div>
          </div>
          <button type="button" class="switch" id="oneSongPerGuest" role="switch"
                  aria-checked="false"></button>
        </div>
      </div>
    </section>
  </div>
</main>

<!-- LAN access drawer, shared with the request page. -->
<div id="sideOverlay" hidden></div>
<aside id="sidebar" aria-hidden="true">
  <div class="side-head">
    <span data-i18n="side.title">局域网接入</span>
    <button id="sideClose" class="side-x" type="button" aria-label="关闭">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M5 5l10 10M15 5L5 15" /></svg>
    </button>
  </div>
  <dl>
    <dt data-i18n="side.wifi">Wi-Fi 名称</dt>
    <dd id="ssidVal">—</dd>
    <dt data-i18n="side.ip">服务地址</dt>
    <dd id="ipVal">—</dd>
  </dl>
  <div id="qrBox"></div>
  <p class="side-hint" data-i18n="side.qr_hint">同一 Wi-Fi 下扫码直达点歌页</p>
</aside>

<script src="i18n/i18n.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="ui/ui.js"></script>
<script>
"use strict";
/* Admin console: delete/reorder queue items, skip, and toggle the
   queued-duplicate rule. Reads state via SSE with a pairing initial
   fetch, mirroring the request page. */
window.I18N_TITLE_KEY = "admin.title";
const $ = (id) => document.getElementById(id);

/* Some endpoints exist with another meaning on the public port (skip on
   the public API is unauthenticated); the admin console always talks to
   the admin port explicitly. */
const BASE = `${location.origin}`;

/* Last state seen, kept so a language switch can re-render it. */
let lastState = null;

/* The two rule switches, rendered and reconciled from server state. */
const switchIds = [
  ["allowQueuedDuplicates", "allowQueuedDuplicates"],
  ["oneSongPerGuest", "oneSongPerGuest"],
];

async function mutate(path, body) {
  const res = await fetch(BASE + path, {
    method: "POST",
    // The lang header localizes server-generated messages.
    headers: { "Content-Type": "application/json", "X-Karaqueue-Lang": i18nLang },
    body: body ? JSON.stringify(body) : "{}",
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.ok === false) throw new Error(data.message || `HTTP ${res.status}`);
  return data;
}

const X_ICON = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"
  stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M5 5l10 10M15 5L5 15" /></svg>`;

/* One line of the running order. Queue rows add the drag handle, the rank
 * and the two host actions; history rows keep the re-request. */
function row(item, { index = 0, controls = null } = {}) {
  const next = controls === "queue" && index === 1;
  const chips = [
    next ? `<span class="chip">${esc(t("tag.next"))}</span>` : "",
    item.status === "skipped" ? `<span class="chip chip--muted">${esc(t("tag.skipped"))}</span>` : "",
  ].join("");
  const chipsHtml = chips ? `<span class="chips">${chips}</span>` : "";
  let actions = "";
  if (controls === "queue") {
    actions = `<button class="linkbtn" data-move="top" data-id="${esc(item.id)}"
        ${index === 1 ? "disabled" : ""}>${esc(t("admin.btn.top"))}</button>
      <button class="xbtn" data-del="${esc(item.id)}" title="${esc(t("admin.btn.remove"))}"
        aria-label="${esc(t("admin.btn.remove"))}">${X_ICON}</button>`;
  } else if (controls === "history") {
    actions = `<button class="linkbtn" data-rerequest="${esc(item.id)}">${esc(t("admin.btn.rerequest"))}</button>`;
  }
  const body = `
    <div class="ttl">${label(item)}${chipsHtml}</div>
    <div class="sub">
      <span class="by">${esc(t("card.requested_by", { by: item.requested_by }))}</span>
      ${actions}
      <span class="dur">${item.duration_s ? fmtDur(item.duration_s) : ""}</span>
    </div>`;

  if (controls === "queue") {
    return `<div class="qcard" data-qid="${esc(item.id)}">
      <button class="grip" type="button" aria-label="${esc(t("admin.drag_hand"))}"
        ${lastState && lastState.queue.length < 2 ? 'aria-disabled="true"' : ""}></button>
      <span class="pos">${index}</span>
      <div class="qbody">${body}</div>
    </div>`;
  }
  return `<div class="track" data-track>
    <span class="pos">${index}</span>
    <div class="tbody">${body}</div>
  </div>`;
}

/* The live track, closed by the one control the host reaches for all
 * night: skip. It is a quiet button, not a filled primary, so a stray
 * thumb never ends a song. */
function nowPanel(item) {
  return `<div class="panel now" data-track>
    <div class="now-row">
      <div class="now-main">
        <div class="now-title">${label(item)}</div>
        <div class="now-meta">
          <span>${esc(t("card.requested_by", { by: item.requested_by }))}</span>
          <span class="dur">${item.duration_s ? fmtDur(item.duration_s) : ""}</span>
        </div>
      </div>
      <button class="btn btn--quiet" id="skip" type="button">${esc(t("admin.skip"))}</button>
    </div>
  </div>`;
}

function render(state) {
  // Never rebuild the rows under a held card: a poll or SSE frame during
  // a drag would detach the card and freeze the gesture. Apply it after.
  if (drag) {
    dragPending = state;
    return;
  }
  lastState = state;
  $("queueCount").textContent = state.queue.length ? t("index.queue_count", { n: state.queue.length }) : "";
  $("historyCount").textContent = state.history.length ? String(state.history.length) : "";
  $("now").innerHTML = state.current
    ? nowPanel(state.current)
    : `<div class="empty empty--now">${t("empty.now")}</div>`;
  $("queue").innerHTML = state.queue.length
    ? `<div class="setlist">${state.queue.map((i, idx) => row(i, { index: idx + 1, controls: "queue" })).join("")}</div>`
    : `<div class="empty">${t("admin.empty.queue")}</div>`;
  // Oldest first with sequence numbers, matching the request page; 1 is
  // the first song ever played. History rows offer one-tap re-request.
  $("history").innerHTML = state.history.length
    ? state.history.slice().reverse().map((h, idx) => row(h, { index: idx + 1, controls: "history" })).join("")
    : `<div class="empty">${t("empty.history")}</div>`;
  // Server state wins: reconcile the two switches from what arrived.
  for (const [id, key] of switchIds) {
    $(id).setAttribute("aria-checked", String(!!state.config[key]));
  }
  enhanceMarquee();
}

/* Click handling for the queue action buttons. Resolving the target with
 * closest() keeps the icon inside a button working as the button. */
document.addEventListener("click", async (e) => {
  const el = e.target.closest?.("[data-del],[data-move],[data-rerequest],#skip");
  if (!el) return;
  try {
    if (el.dataset.del) {
      await mutate("/api/delete", { id: el.dataset.del });
    } else if (el.dataset.move === "top") {
      await mutate("/api/reorder", { id: el.dataset.id, direction: "top" });
    } else if (el.dataset.rerequest) {
      await mutate("/api/rerequest", { id: el.dataset.rerequest, by: "管理员" });
    } else if (el.id === "skip") {
      await mutate("/api/skip");
    }
    await refresh();
  } catch (err) {
    showToast("fail", t("admin.alert_action_failed", { e: err.message }));
  }
});

/* Rule switches: flip immediately (optimistic), let the server state
 * correct us, and roll the knob back when the save fails. */
for (const [id, key] of switchIds) {
  $(id).addEventListener("click", async (e) => {
    const el = e.currentTarget;
    const next = el.getAttribute("aria-checked") !== "true";
    el.setAttribute("aria-checked", String(next));
    try {
      await mutate("/api/config", { [key]: next });
    } catch (err) {
      el.setAttribute("aria-checked", String(!next));
      showToast("fail", t("admin.alert_save_failed", { e: err.message }));
    }
  });
}

async function refresh() {
  const res = await fetch(BASE + "/api/state");
  render(await res.json());
}

/* --- Drag to reorder --------------------------------------------------
 * Pointer-based (mouse/pen/touch) on the grip handle. While dragging,
 * the held card follows the pointer and the siblings glide out of the
 * way with small transforms; on drop the DOM order is corrected and
 * the new slot goes to /api/reorder { id, index }. Escape cancels.
 * Keyboard users press ArrowUp/ArrowDown on the focused grip. */
let drag = null;
let dragRaf = 0;
let dragY = 0;
/* State that arrived while dragging; the rows cannot be replaced under
   the finger, so it waits for the drop. */
let dragPending = null;

function queueRows() {
  return [...$("queue").querySelectorAll(".qcard")];
}

function gripDisabled(grip) {
  return grip.getAttribute("aria-disabled") === "true";
}

/* One drag frame: move the held card to the pointer, then shift only the
   siblings whose slot actually changed (rewriting every row every frame
   restarts each row's transition and is what made the drag stutter). */
function updateDrag(y) {
  if (!drag) return;
  const originRect = drag.rects[drag.origin];
  const dy = y - drag.startClientY;
  drag.cardEl.style.transform = `translateY(${dy}px) rotate(1deg) scale(1.01)`;
  const offset = Math.round((y - (originRect.top + originRect.height / 2)) / drag.slot);
  drag.target = Math.max(0, Math.min(drag.list.length - 1, drag.origin + offset));
  drag.list.forEach((el, i) => {
    if (el === drag.cardEl) return;
    const shift = (i > drag.origin && i <= drag.target) ? -drag.slot
      : (i < drag.origin && i >= drag.target) ? drag.slot : 0;
    if (drag.shifts[i] === shift) return;
    drag.shifts[i] = shift;
    el.style.transform = shift ? `translateY(${shift}px)` : "";
  });
}

document.addEventListener("pointerdown", (e) => {
  const grip = e.target.closest?.(".grip");
  if (!grip || gripDisabled(grip) || drag) return;
  const list = queueRows();
  if (list.length < 2) return;
  e.preventDefault();
  dragY = e.clientY;
  drag = {
    cardEl: grip.closest(".qcard"),
    list,
    rects: list.map((el) => el.getBoundingClientRect()),
    origin: list.indexOf(grip.closest(".qcard")),
    startClientY: e.clientY,
    target: list.indexOf(grip.closest(".qcard")),
    shifts: list.map(() => 0),
  };
  drag.slot = drag.rects[1].top - drag.rects[0].top || (drag.rects[0].height + 8);
  drag.cardEl.classList.add("dragging");
});

document.addEventListener("pointermove", (e) => {
  if (!drag) return;
  dragY = e.clientY;
  // Coalesce to one write per frame; high-rate mice fire faster than paint.
  if (dragRaf) return;
  dragRaf = requestAnimationFrame(() => {
    dragRaf = 0;
    updateDrag(dragY);
  });
});

function endDrag(commit) {
  if (!drag) return;
  if (dragRaf) {
    cancelAnimationFrame(dragRaf);
    dragRaf = 0;
  }
  updateDrag(dragY); // flush the last position so drop uses the final slot
  const d = drag;
  const pending = dragPending;
  drag = null;
  dragPending = null;
  d.list.forEach((el) => {
    el.style.transform = "";
    el.style.zIndex = "";
  });
  d.cardEl.classList.remove("dragging");
  if (!commit || d.target === d.origin) {
    if (pending) render(pending);
    return;
  }
  // Optimistic DOM reorder; the server's authoritative broadcast follows.
  if (d.target > d.origin) d.list[d.target].after(d.cardEl);
  else d.list[d.target].before(d.cardEl);
  const id = d.cardEl.dataset.qid;
  mutate("/api/reorder", { id, index: d.target })
    .then(() => refresh())
    .catch(async (err) => {
      showToast("fail", t("admin.alert_action_failed", { e: err.message }));
      await refresh();
    });
}

document.addEventListener("pointerup", (e) => {
  if (!drag) return;
  dragY = e.clientY;
  endDrag(true);
});
document.addEventListener("pointercancel", () => endDrag(false));

/* Keyboard reorder on the grip itself: focus it, press ↑ / ↓. */
document.addEventListener("keydown", (e) => {
  const grip = e.target.closest?.(".grip");
  if (!grip || gripDisabled(grip)) return;
  if (e.key === "ArrowUp" || e.key === "ArrowDown") {
    e.preventDefault();
    mutate("/api/reorder", { id: grip.closest(".qcard").dataset.qid, direction: e.key === "ArrowUp" ? "up" : "down" })
      .then(() => refresh())
      .catch((err) => showToast("fail", t("admin.alert_action_failed", { e: err.message })));
  } else if (e.key === "Escape" && drag) {
    endDrag(false);
  }
});

let es = null;
function reconnect() {
  if (es) es.close();
  refresh().catch(() => {});
  es = new EventSource(BASE + "/api/events");
  es.addEventListener("state", (e) => render(JSON.parse(e.data)));
}

/* Boot: resolve language first (render needs t()), then talk to the
   server. A language switch re-renders the last known state. */
setOnLangSwitch(() => {
  if (lastState) render(lastState);
  refreshSidebarI18n();
});
initI18n(() => {
  initSidebar();
  refreshSidebarI18n();
  reconnect();
});

/* Same background-tab resilience as the request page: re-sync when the
   tab becomes visible, plus a light poll while visible. */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") refresh().catch(() => {});
});
setInterval(() => {
  if (document.visibilityState === "visible") refresh().catch(() => {});
}, 5000);
</script>
</body>
</html>
