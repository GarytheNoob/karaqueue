<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KaraQueue 管理后台</title>
<style>
  /* Shares the card design language of the request page. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; background: #101014; color: #e8e8ee; min-height: 100vh; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 20px; margin: 8px 0 16px; }
  h2 { font-size: 14px; margin: 24px 0 8px; color: #9aa; letter-spacing: .05em; }
  input[type="text"] {
    background: #1c1c22; border: 1px solid #33333d; border-radius: 10px;
    padding: 10px 14px; color: inherit; font-size: 14px; width: 100%;
  }
  input:focus { outline: none; border-color: #58a6ff; }
  button {
    background: #2f6fed; color: #fff; border: 0; border-radius: 10px;
    padding: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  button.mini {
    background: #1c1c22; border: 1px solid #3a3a44; color: #bbb;
    font-size: 13px; font-weight: 400; padding: 6px 10px; width: auto;
  }
  button.mini.danger { color: #f66; border-color: #633; }
  button.mini:disabled { opacity: .35; cursor: default; }
  .card { background: #17171d; border: 1px solid #26262e; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .card.now { border-color: #2f6fed; }
  .card .title { font-size: 14px; line-height: 1.5; display: flex; align-items: center; }
  .card .meta { font-size: 12px; color: #888; margin-top: 4px; display: flex; justify-content: space-between; }
  .tag { font-size: 11px; background: #2f6fed; color: #fff; border-radius: 4px; padding: 1px 6px; margin-right: 6px; vertical-align: 2px; }
  .tag.next { background: #e0a33f; color: #2b1d00; }
  .tag.done { background: #444; color: #aaa; }
  .card.next { border-color: #e0a33f; }
  .idx { color: #67718a; font-size: 12px; font-weight: 600; margin-right: 7px; font-variant-numeric: tabular-nums; }
  .empty { color: #666; font-size: 13px; padding: 6px 2px; }
  .actions { margin-top: 8px; display: flex; gap: 6px; }
  .bar { display: flex; gap: 8px; align-items: center; }
  .configbox { background: #17171d; border: 1px solid #26262e; border-radius: 12px; padding: 12px; font-size: 14px; }
  .configbox + .configbox { margin-top: 10px; }
  .configbox input { width: 18px; height: 18px; accent-color: #2f6fed; }
  .configbox .head { display: flex; gap: 10px; align-items: center; }
  .configbox .desc { color: #778; font-size: 12px; margin-top: 6px; line-height: 1.5; }
  .hint { color: #778; font-size: 12px; margin-top: 6px; line-height: 1.5; }
  .desc[data-i18n] { white-space: pre-line; }
</style>
</head>
<body>
<main>
  <div class="bar">
    <h1 data-i18n="admin.title">KaraQueue 管理后台</h1>
    <span id="langSwitch"></span>
  </div>

  <h2 data-i18n="head.now_playing">正在播放</h2>
  <div id="now"></div>
  <div class="actions"><button class="mini" id="skip" data-i18n="admin.skip">跳过当前，直接播下一首</button></div>

  <h2 data-i18n="admin.rules_head">点歌规则</h2>
  <div class="configbox">
    <div class="head">
      <input type="checkbox" id="allowQueuedDuplicates" />
      <label for="allowQueuedDuplicates" data-i18n="admin.dup_label">允许队列中重复点同一首歌</label>
    </div>
    <div class="desc" data-i18n="admin.dup_desc">关闭：同一首歌重复提交会被拒绝（正在播放/已在队列中）。
开启：同一首歌可以在排队里出现多次。</div>
  </div>
  <div class="configbox">
    <div class="head">
      <input type="checkbox" id="oneSongPerGuest" />
      <label for="oneSongPerGuest" data-i18n="admin.fair_label">公平轮唱 · 每人限点一首</label>
    </div>
    <div class="desc" data-i18n="admin.fair_desc">开启后每人（按浏览器 Cookie 识别，不受改昵称影响）同时只能有一首在唱或在排，等自己那首唱完才能再点；被锁定期间，点歌页上该客人的「加入队列」按钮置灰、昵称输入框锁定。</div>
  </div>

  <h2 data-i18n="head.queue">队列</h2>
  <div class="hint" data-i18n="admin.queue_hint">⤒ 提前到队首 · ↑↓ 调整顺序 · ✕ 移出队列。改动实时广播到大屏和所有点歌页。</div>
  <div id="queue"></div>

  <h2 data-i18n="head.history">已播历史</h2>
  <div id="history"></div>
</main>

<script src="i18n/i18n.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="ui/ui.js"></script>
<script>
"use strict";
/* Admin console: delete/reorder queue items, skip, and toggle the
   queued-duplicate rule. Reads state via SSE with a pairing initial
   fetch, mirroring the request page. */
window.I18N_TITLE_KEY = "admin.title";
const $ = (id) => document.getElementById(id);

/* Some endpoints exist with another meaning on the public port (skip on
   the public API is unauthenticated); the admin console always talks to
   the admin port explicitly. */
const BASE = `${location.origin}`;

/* Last state seen, kept so a language switch can re-render it. */
let lastState = null;

async function mutate(path, body) {
  const res = await fetch(BASE + path, {
    method: "POST",
    // The lang header localizes server-generated messages.
    headers: { "Content-Type": "application/json", "X-Karaqueue-Lang": i18nLang },
    body: body ? JSON.stringify(body) : "{}",
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.ok === false) throw new Error(data.message || `HTTP ${res.status}`);
  return data;
}

function card(item, { now = false, next = false, index = 0, isLast = false, controls = null } = {}) {
  const idx = index ? `<span class="idx">${index}.</span>` : "";
  const tag = now
    ? `<span class="tag">NOW</span>`
    : next
      ? `<span class="tag next">NEXT</span>`
      : item.status === "played" || item.status === "skipped"
        ? `<span class="tag done">${t(item.status === "skipped" ? "tag.skipped" : "tag.played")}</span>`
        : "";
  let row = "";
  if (controls === "queue") {
    row = `<div class="actions">
      <button class="mini" data-move="top" data-id="${esc(item.id)}" ${index === 1 ? "disabled" : ""}>${esc(t("admin.btn.top"))}</button>
      <button class="mini" data-move="up" data-id="${esc(item.id)}" ${index <= 1 ? "disabled" : ""}>${esc(t("admin.btn.up"))}</button>
      <button class="mini" data-move="down" data-id="${esc(item.id)}" ${isLast ? "disabled" : ""}>${esc(t("admin.btn.down"))}</button>
      <button class="mini danger" data-del="${esc(item.id)}">${esc(t("admin.btn.remove"))}</button>
    </div>`;
  } else if (controls === "history") {
    row = `<div class="actions"><button class="mini" data-rerequest="${esc(item.id)}">${esc(t("admin.btn.rerequest"))}</button></div>`;
  }
  return `<div class="card ${now ? "now" : next ? "next" : ""}">
    <div class="title">${idx}${tag}${label(item)}</div>
    <div class="meta"><span>${esc(t("card.requested_by", { by: item.requested_by }))}</span><span>${item.duration_s ? fmtDur(item.duration_s) : ""}</span></div>
    ${row}
  </div>`;
}

function render(state) {
  lastState = state;
  $("now").innerHTML = state.current
    ? card(state.current, { now: true })
    : `<div class="empty">${t("empty.now")}</div>`;
  $("queue").innerHTML = state.queue.length
    ? state.queue.map((i, idx) => card(i, {
        index: idx + 1,
        isLast: idx === state.queue.length - 1,
        next: idx === 0,
        controls: "queue",
      })).join("")
    : `<div class="empty">${t("admin.empty.queue")}</div>`;
  // Oldest first with sequence numbers, matching the request page; 1 is
  // the first song ever played. History cards offer one-tap re-request.
  $("history").innerHTML = state.history.length
    ? [...state.history].reverse().map((h, idx) => card(h, { index: idx + 1, controls: "history" })).join("")
    : `<div class="empty">${t("empty.history")}</div>`;
  const box = $("allowQueuedDuplicates");
  if (box.checked !== !!state.config.allowQueuedDuplicates) box.checked = !!state.config.allowQueuedDuplicates;
  const fairBox = $("oneSongPerGuest");
  if (fairBox.checked !== !!state.config.oneSongPerGuest) fairBox.checked = !!state.config.oneSongPerGuest;
  enhanceMarquee();
}

/* Click handling for the queue action buttons. */
document.addEventListener("click", async (e) => {
  const el = e.target;
  try {
    if (el.dataset.del) {
      await mutate("/api/delete", { id: el.dataset.del });
    } else if (el.dataset.move === "up" || el.dataset.move === "down" || el.dataset.move === "top") {
      await mutate("/api/reorder", { id: el.dataset.id, direction: el.dataset.move });
    } else if (el.dataset.rerequest) {
      await mutate("/api/rerequest", { id: el.dataset.rerequest, by: "管理员" });
    } else if (el.id === "skip") {
      await mutate("/api/skip");
    } else {
      return;
    }
    await refresh();
  } catch (err) {
    alert(t("admin.alert_action_failed", { e: err.message }));
  }
});

$("allowQueuedDuplicates").addEventListener("change", async (e) => {
  try {
    await mutate("/api/config", { allowQueuedDuplicates: e.target.checked });
  } catch (err) {
    alert(t("admin.alert_save_failed", { e: err.message }));
    e.target.checked = !e.target.checked;
  }
});

$("oneSongPerGuest").addEventListener("change", async (e) => {
  try {
    await mutate("/api/config", { oneSongPerGuest: e.target.checked });
  } catch (err) {
    alert(t("admin.alert_save_failed", { e: err.message }));
    e.target.checked = !e.target.checked;
  }
});

async function refresh() {
  const res = await fetch(BASE + "/api/state");
  render(await res.json());
}

let es = null;
function reconnect() {
  if (es) es.close();
  refresh().catch(() => {});
  es = new EventSource(BASE + "/api/events");
  es.addEventListener("state", (e) => render(JSON.parse(e.data)));
}

/* Boot: resolve language first (render needs t()), then talk to the
   server. A language switch re-renders the last known state. */
setOnLangSwitch(() => {
  if (lastState) render(lastState);
});
initI18n(reconnect);

/* Same background-tab resilience as the request page: re-sync when the
   tab becomes visible, plus a light poll while visible. */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") refresh().catch(() => {});
});
setInterval(() => {
  if (document.visibilityState === "visible") refresh().catch(() => {});
}, 5000);
</script>
</body>
</html>
