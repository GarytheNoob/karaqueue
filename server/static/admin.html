<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KaraQueue 管理后台</title>
<style>
  /* Shares the card design language of the request page. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; background: #101014; color: #e8e8ee; min-height: 100vh; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h2 { font-size: 14px; margin: 24px 0 8px; color: #9aa; letter-spacing: .05em; }
  /* Same three-slot topbar as the request page. */
  .topbar {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    gap: 8px; margin: -6px 0 14px; padding: 12px 0 2px;
    position: sticky; top: 0; z-index: 30;
    background: linear-gradient(#101014 82%, rgba(16,16,20,0));
  }
  .topbar h1 { font-size: 19px; margin: 0; white-space: nowrap; }
  .topbar .hdr-right { grid-column: 3; justify-self: end; color: #666; }
  input[type="text"] {
    background: #1c1c22; border: 1px solid #33333d; border-radius: 10px;
    padding: 10px 14px; color: inherit; font-size: 14px; width: 100%;
  }
  input:focus { outline: none; border-color: #58a6ff; }
  button {
    background: #2f6fed; color: #fff; border: 0; border-radius: 10px;
    padding: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  button.mini {
    background: #1c1c22; border: 1px solid #3a3a44; color: #bbb;
    font-size: 13px; font-weight: 400; padding: 6px 10px; width: auto;
  }
  button.mini.danger { color: #f66; border-color: #633; }
  button.mini:disabled { opacity: .35; cursor: default; }
  .card { background: #17171d; border: 1px solid #26262e; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .card.now { border-color: #2f6fed; }
  .card .title { font-size: 14px; line-height: 1.5; display: flex; align-items: center; }
  .card .meta { font-size: 12px; color: #888; margin-top: 5px; display: flex; justify-content: space-between; align-items: baseline; min-height: 17px; }
  .tag { font-size: 11px; background: #2f6fed; color: #fff; border-radius: 4px; padding: 1px 6px; margin-right: 6px; vertical-align: 2px; }
  .tag.next { background: #e0a33f; color: #2b1d00; }
  .tag.done { background: #444; color: #aaa; }
  .card.next { border-color: #e0a33f; }
  /* Queue cards are flex rows: grip | body | remove. */
  .qcard { display: flex; align-items: stretch; gap: 5px; }
  .qcard .qbody { flex: 1; min-width: 0; padding: 1px 0; }
  .qcard .xbtn { flex: none; align-self: stretch; width: 34px; padding: 0 8px; }
  .grip {
    align-self: stretch; flex: 0 0 24px;
    display: flex; align-items: center; justify-content: center;
    border: 0; background: #1c1c22; border-radius: 8px; cursor: grab;
    padding: 0; touch-action: none; min-height: 52px;
  }
  /* Grip: three single dots stacked vertically, fixed size — the tiles
   * are sized so the dots never clip, and the block never stretches. */
  .grip::before {
    content: ""; display: block; width: 5px; height: 36px; flex: none;
    background-image: radial-gradient(circle, #5a6070 1.5px, transparent 1.9px);
    background-size: 5px 12px; background-position: center; background-repeat: repeat;
  }
  .grip:hover { background: #22222b; }
  .grip:active { cursor: grabbing; background: #2a2a35; }
  .grip:focus-visible { box-shadow: 0 0 0 2px #58a6ff55; outline: none; }
  .grip[aria-disabled="true"] { opacity: .3; cursor: default; }
  .qcard.dragging { transition: none; position: relative; box-shadow: 0 10px 24px rgba(0,0,0,.5); opacity: .95; }
  .qcard { transition: transform .15s ease; }
  .idx { color: #67718a; font-size: 12px; font-weight: 600; margin-right: 7px; font-variant-numeric: tabular-nums; }
  .empty { color: #666; font-size: 13px; padding: 6px 2px; }
  .actions { margin-top: 8px; display: flex; gap: 6px; }
  .configbox { background: #17171d; border: 1px solid #26262e; border-radius: 12px; padding: 12px; font-size: 14px; }
  .configbox + .configbox { margin-top: 10px; }
  .configbox .head { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
  .configbox .head label { min-width: 0; }
  /* Toggle switch: track + knob, green when on. The knob's soft drop
   * shadow is the only skeuomorphism on the page. */
  .switch {
    position: relative; width: 42px; height: 24px; flex: none;
    border-radius: 999px; background: #26262e; border: 1px solid #33333d;
    cursor: pointer; transition: background .15s ease, border-color .15s ease; padding: 0;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
    border-radius: 50%; background: #7c8394; box-shadow: 0 1px 3px rgba(0,0,0,.5);
    transition: transform .15s ease, background .15s ease;
  }
  .switch[aria-checked="true"] { background: #2fa25c; border-color: #2fa25c; }
  .switch[aria-checked="true"]::after { transform: translateX(18px); background: #fff; }
  .switch:focus-visible { box-shadow: 0 0 0 2px #58a6ff55; outline: none; }
  .configbox .desc { color: #778; font-size: 12px; margin-top: 6px; line-height: 1.5; }
  .hint { color: #778; font-size: 12px; margin-top: 6px; line-height: 1.5; }
  .desc[data-i18n] { white-space: pre-line; }
</style>
</head>
<body>
<main>
  <header class="topbar">
    <h1 data-i18n="admin.title">KaraQueue 管理后台</h1>
    <span class="hdr-right">
      <span id="langSwitch"></span>
      <button id="sideBtn" class="side-btn" aria-label="局域网接入" type="button">☰</button>
    </span>
  </header>

  <h2 data-i18n="head.now_playing">正在播放</h2>
  <div id="now"></div>
  <div class="actions"><button class="mini" id="skip" data-i18n="admin.skip">跳过当前，直接播下一首</button></div>

  <h2 data-i18n="admin.rules_head">点歌规则</h2>
  <div class="configbox">
    <div class="head">
      <label for="allowQueuedDuplicates" data-i18n="admin.dup_label">允许队列中重复点同一首歌</label>
      <button type="button" class="switch" id="allowQueuedDuplicates" role="switch" aria-checked="false"></button>
    </div>
    <div class="desc" data-i18n="admin.dup_desc">关闭：同一首歌重复提交会被拒绝（正在播放/已在队列中）。
开启：同一首歌可以在排队里出现多次。</div>
  </div>
  <div class="configbox">
    <div class="head">
      <label for="oneSongPerGuest" data-i18n="admin.fair_label">公平轮唱 · 每人限点一首</label>
      <button type="button" class="switch" id="oneSongPerGuest" role="switch" aria-checked="false"></button>
    </div>
    <div class="desc" data-i18n="admin.fair_desc">开启后每人（按浏览器 Cookie 识别，不受改昵称影响）同时只能有一首在唱或在排，等自己那首唱完才能再点；被锁定期间，点歌页上该客人的「加入队列」按钮置灰、昵称输入框锁定。</div>
  </div>

  <h2 data-i18n="head.queue">队列</h2>
  <div class="hint" data-i18n="admin.queue_hint">⤒ 提前到队首 · ↑↓ 调整顺序 · ✕ 移出队列。改动实时广播到大屏和所有点歌页。</div>
  <div id="queue"></div>

  <h2 data-i18n="head.history">已播历史</h2>
  <div id="history"></div>
</main>

<!-- LAN access drawer, shared with the request page. -->
<div id="sideOverlay" hidden></div>
<aside id="sidebar" aria-hidden="true">
  <div class="side-head">
    <span data-i18n="side.title">局域网接入</span>
    <button id="sideClose" class="side-x" type="button" aria-label="关闭">×</button>
  </div>
  <dl>
    <dt data-i18n="side.wifi">Wi-Fi 名称</dt>
    <dd id="ssidVal">—</dd>
    <dt data-i18n="side.ip">服务地址</dt>
    <dd id="ipVal">—</dd>
  </dl>
  <div id="qrBox"></div>
  <p class="side-hint" data-i18n="side.qr_hint">同一 Wi-Fi 下扫码直达点歌页</p>
</aside>

<script src="i18n/i18n.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="ui/ui.js"></script>
<script>
"use strict";
/* Admin console: delete/reorder queue items, skip, and toggle the
   queued-duplicate rule. Reads state via SSE with a pairing initial
   fetch, mirroring the request page. */
window.I18N_TITLE_KEY = "admin.title";
const $ = (id) => document.getElementById(id);

/* Some endpoints exist with another meaning on the public port (skip on
   the public API is unauthenticated); the admin console always talks to
   the admin port explicitly. */
const BASE = `${location.origin}`;

/* Last state seen, kept so a language switch can re-render it. */
let lastState = null;

/* The two rule switches, rendered and reconciled from server state. */
const switchIds = [
  ["allowQueuedDuplicates", "allowQueuedDuplicates"],
  ["oneSongPerGuest", "oneSongPerGuest"],
];

async function mutate(path, body) {
  const res = await fetch(BASE + path, {
    method: "POST",
    // The lang header localizes server-generated messages.
    headers: { "Content-Type": "application/json", "X-Karaqueue-Lang": i18nLang },
    body: body ? JSON.stringify(body) : "{}",
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.ok === false) throw new Error(data.message || `HTTP ${res.status}`);
  return data;
}

function card(item, { now = false, next = false, index = 0, controls = null } = {}) {
  const tag = now
    ? `<span class="tag">NOW</span>`
    : next
      ? `<span class="tag next">NEXT</span>`
      : item.status === "played" || item.status === "skipped"
        ? `<span class="tag done">${t(item.status === "skipped" ? "tag.skipped" : "tag.played")}</span>`
        : "";
  const idx = index ? `<span class="idx">${index}</span>` : "";
  const line = (extraRow = "") => `
    <div class="title">${label(item)}<span class="badges">${tag}</span></div>
    <div class="meta"><span>${idx}${esc(t("card.requested_by", { by: item.requested_by }))}</span><span>${item.duration_s ? fmtDur(item.duration_s) : ""}</span></div>
    ${extraRow}`;
  let row = "";
  if (controls === "queue") {
    row = `<div class="actions">
      <button class="mini" data-move="top" data-id="${esc(item.id)}" ${index === 1 ? "disabled" : ""}>${esc(t("admin.btn.top"))}</button>
    </div>`;
  } else if (controls === "history") {
    row = `<div class="actions"><button class="mini" data-rerequest="${esc(item.id)}">${esc(t("admin.btn.rerequest"))}</button></div>`;
  }
  if (controls === "queue") {
    return `<div class="card qcard ${next ? "next" : ""}" data-qid="${esc(item.id)}">
      <button class="grip" type="button" aria-label="${esc(t("admin.drag_hand"))}" ${lastState && lastState.queue.length < 2 ? 'aria-disabled="true"' : ""}></button>
      <div class="qbody">${line(row)}</div>
      <button class="mini danger xbtn" data-del="${esc(item.id)}" title="${esc(t("admin.btn.remove"))}">✕</button>
    </div>`;
  }
  return `<div class="card ${now ? "now" : next ? "next" : ""}">${line(row)}</div>`;
}

function render(state) {
  lastState = state;
  $("now").innerHTML = state.current
    ? card(state.current, { now: true })
    : `<div class="empty">${t("empty.now")}</div>`;
  $("queue").innerHTML = state.queue.length
    ? state.queue.map((i, idx) => card(i, {
        index: idx + 1,
        next: idx === 0,
        controls: "queue",
      })).join("")
    : `<div class="empty">${t("admin.empty.queue")}</div>`;
  // Oldest first with sequence numbers, matching the request page; 1 is
  // the first song ever played. History cards offer one-tap re-request.
  $("history").innerHTML = state.history.length
    ? [...state.history].reverse().map((h, idx) => card(h, { index: idx + 1, controls: "history" })).join("")
    : `<div class="empty">${t("empty.history")}</div>`;
  // Server state wins: reconcile the two switches from what arrived.
  for (const [id, key] of switchIds) {
    $(id).setAttribute("aria-checked", String(!!state.config[key]));
  }
  enhanceMarquee();
}

/* Click handling for the queue action buttons. */
document.addEventListener("click", async (e) => {
  const el = e.target;
  try {
    if (el.dataset.del) {
      await mutate("/api/delete", { id: el.dataset.del });
    } else if (el.dataset.move === "top") {
      await mutate("/api/reorder", { id: el.dataset.id, direction: "top" });
    } else if (el.dataset.rerequest) {
      await mutate("/api/rerequest", { id: el.dataset.rerequest, by: "管理员" });
    } else if (el.id === "skip") {
      await mutate("/api/skip");
    } else {
      return;
    }
    await refresh();
  } catch (err) {
    showToast("fail", t("admin.alert_action_failed", { e: err.message }));
  }
});

/* Rule switches: flip immediately (optimistic), let the server state
 * correct us, and roll the knob back when the save fails. */
for (const [id, key] of switchIds) {
  $(id).addEventListener("click", async (e) => {
    const el = e.currentTarget;
    const next = el.getAttribute("aria-checked") !== "true";
    el.setAttribute("aria-checked", String(next));
    try {
      await mutate("/api/config", { [key]: next });
    } catch (err) {
      el.setAttribute("aria-checked", String(!next));
      showToast("fail", t("admin.alert_save_failed", { e: err.message }));
    }
  });
}

async function refresh() {
  const res = await fetch(BASE + "/api/state");
  render(await res.json());
}

/* --- Drag to reorder --------------------------------------------------
 * Pointer-based (mouse/pen/touch) on the grip handle. While dragging,
 * the held card follows the pointer and the siblings glide out of the
 * way with small transforms; on drop the DOM order is corrected and
 * the new slot goes to /api/reorder { id, index }. Escape cancels.
 * Keyboard users press ArrowUp/ArrowDown on the focused grip. */
let drag = null;

function queueRows() {
  return [...$("queue").querySelectorAll(".qcard")];
}

function gripDisabled(grip) {
  return grip.getAttribute("aria-disabled") === "true";
}

document.addEventListener("pointerdown", (e) => {
  const grip = e.target.closest?.(".grip");
  if (!grip || gripDisabled(grip) || drag) return;
  const list = queueRows();
  if (list.length < 2) return;
  e.preventDefault();
  drag = {
    cardEl: grip.closest(".qcard"),
    list,
    rects: list.map((el) => el.getBoundingClientRect()),
    origin: list.indexOf(grip.closest(".qcard")),
    startClientY: e.clientY,
    target: list.indexOf(grip.closest(".qcard")),
  };
  drag.slot = drag.rects[1].top - drag.rects[0].top || (drag.rects[0].height + 8);
  drag.cardEl.classList.add("dragging");
});

document.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const originRect = drag.rects[drag.origin];
  const dy = e.clientY - drag.startClientY;
  drag.cardEl.style.transform = `translateY(${dy}px) rotate(1deg) scale(1.01)`;
  drag.cardEl.style.zIndex = "5";
  const offset = Math.round((e.clientY - (originRect.top + originRect.height / 2)) / drag.slot);
  drag.target = Math.max(0, Math.min(drag.list.length - 1, drag.origin + offset));
  drag.list.forEach((el, i) => {
    if (el === drag.cardEl) return;
    const shift = (i > drag.origin && i <= drag.target) ? -drag.slot
      : (i < drag.origin && i >= drag.target) ? drag.slot : 0;
    el.style.transform = shift ? `translateY(${shift}px)` : "";
  });
});

function endDrag(commit) {
  if (!drag) return;
  const d = drag;
  drag = null;
  d.list.forEach((el) => {
    el.style.transform = "";
    el.style.zIndex = "";
  });
  d.cardEl.classList.remove("dragging");
  if (!commit || d.target === d.origin) return;
  // Optimistic DOM reorder; the server's authoritative broadcast follows.
  if (d.target > d.origin) d.list[d.target].after(d.cardEl);
  else d.list[d.target].before(d.cardEl);
  const id = d.cardEl.dataset.qid;
  mutate("/api/reorder", { id, index: d.target })
    .then(() => refresh())
    .catch(async (err) => {
      showToast("fail", t("admin.alert_action_failed", { e: err.message }));
      await refresh();
    });
}

document.addEventListener("pointerup", () => endDrag(true));
document.addEventListener("pointercancel", () => endDrag(false));

/* Keyboard reorder on the grip itself: focus it, press ↑ / ↓. */
document.addEventListener("keydown", (e) => {
  const grip = e.target.closest?.(".grip");
  if (!grip || gripDisabled(grip)) return;
  if (e.key === "ArrowUp" || e.key === "ArrowDown") {
    e.preventDefault();
    mutate("/api/reorder", { id: grip.closest(".qcard").dataset.qid, direction: e.key === "ArrowUp" ? "up" : "down" })
      .then(() => refresh())
      .catch((err) => showToast("fail", "admin.alert_action_failed", { e: err.message }));
  } else if (e.key === "Escape" && drag) {
    endDrag(false);
  }
});

let es = null;
function reconnect() {
  if (es) es.close();
  refresh().catch(() => {});
  es = new EventSource(BASE + "/api/events");
  es.addEventListener("state", (e) => render(JSON.parse(e.data)));
}

/* Boot: resolve language first (render needs t()), then talk to the
   server. A language switch re-renders the last known state. */
setOnLangSwitch(() => {
  if (lastState) render(lastState);
  refreshSidebarI18n();
});
initI18n(() => {
  initSidebar();
  refreshSidebarI18n();
  reconnect();
});

/* Same background-tab resilience as the request page: re-sync when the
   tab becomes visible, plus a light poll while visible. */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") refresh().catch(() => {});
});
setInterval(() => {
  if (document.visibilityState === "visible") refresh().catch(() => {});
}, 5000);
</script>
</body>
</html>
